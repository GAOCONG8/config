qc:
  cmds:
    - name: appsh
      text: |
        mv /customer/bin/app.sh /customer/bin/app.sh2
        killall ash
        killall cameraApp
      appendCR: true
      profileIds: []
      group: ''
    - name: push-camApp
      text: adb push cameraApp /customer/bin/
      appendCR: true
      profileIds: []
      group: ''
    - name: adb
      text: adb shell
      appendCR: true
      profileIds: []
      group: ''
    - name: sigClient
      text: sigClient ws://127.0.0.1:8080 1
      appendCR: false
      profileIds: []
      group: ''
    - name: startCameraApp
      text: |
        killall cameraApp
        chmod +x /customer/bin/sigClient
        chmod +x /customer/bin/cameraApp
        cameraApp &
      appendCR: true
      profileIds: []
      group: ''
    - name: swap gdb
      text: |-
        dd if=/dev/zero of=/customer/swapfile bs=1M count=512

        chmod 600 /customer/swapfile
        mkswap /customer/swapfile
        swapon /customer/swapfile
      appendCR: true
      profileIds: []
      group: ''
    - name: 3201打包
      text: |
        h update -s
        cd ~/3201/
        cd ~/3201/source/project/
        git checkout .
        cd ~/3201/source/sdk/
        git checkout .
        repo sync
        h docker shell sigmastar
        h lunch 1
        h make all

        h make pack 
      appendCR: true
      profileIds: []
      group: ''
    - name: adb-pull
      text: adb pull /udisk/ .
      appendCR: false
      profileIds: []
      group: ''
    - name: hlsdk 同步
      text: |-
        cd ~/temp/hollyos-sdk/
        cd hollyos-sdk/
        git fetch 
        git checkout .
        git log dev..origin/dev --pretty=oneline > 1.log
        git pull
        find . -name "*.a" -delete
        cd ~/temp/
        tar czvf hollyos-sdk.tar.gz --exclude=.git hollyos-sdk/
        mv hollyos-sdk.tar.gz test.bin  
      appendCR: true
      profileIds: []
      group: ''
    - name: 3201蓝牙
      text: |
        eeprom_getset /dev/eeprom product_sn
      appendCR: true
      profileIds: []
      group: ''
    - name: pullCamApp
      text: >
        D:\app\install\rsync-win\rsync-win.exe --src
        gaocong@192.168.59.81:/home/shared/gaocong/3201/hollyos-sdk/build/bin/cameraApp
        --dest .
      appendCR: true
      profileIds: []
      group: ''
    - name: push-test.bin
      text: |-
        cd Z:\temp
        adb push test.bin /udisk
      appendCR: true
      profileIds: []
      group: ''
    - name: use_adb
      text: |-
        composite -all
        composite +adb
        touch  /udisk/usb_switch_none
        touch  /udisk/usb_switch_adb
        eeprom_getset /dev/eeprom uart_debug true
        sync
      appendCR: true
      profileIds: []
      group: ''
    - name: net-cat
      text: netstat -lntup
      appendCR: true
      profileIds: []
      group: ''
    - name: cat-3201-version
      text: |
        cat customer/etc/version.txt

        uart_host --cmd-version-2610
      appendCR: true
      profileIds: []
      group: ''
    - name: httpd
      text: |
        httpd -p 2026 -h /udisk/
      appendCR: true
      profileIds: []
      group: ''
    - name: 3201-version
      text: |+
        cat /customer/etc/version.txt
        uart_host --cmd-version-2610

      appendCR: true
      profileIds: []
      group: ''
    - name: rsync
      text: 'rsync-win.exe --src gaocong@192.168.59.81: --dest .'
      appendCR: false
      profileIds: []
      group: ''
    - name: unAppsh
      text: |
        mv /customer/bin/app.sh2 /customer/bin/app.sh
      appendCR: true
      profileIds: []
      group: ''
    - name: remove_3201_log
      text: rm -rf /userdata/logs/
      appendCR: true
      profileIds: []
      group: ''
  groups: []
enableAutomaticUpdates: false
serialTimestampPlugin: {}
